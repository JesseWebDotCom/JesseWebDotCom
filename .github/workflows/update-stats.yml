name: Update stats card

on:
  schedule:
    - cron: '17 6 * * *' # daily
  workflow_dispatch:
  push:
    branches: [main]
    paths: [scripts/build-stats.mjs]

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/build-stats.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/stats-*.svg
          git diff --cached --quiet || git commit -m "chore: refresh stats card"
          git push
